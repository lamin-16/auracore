name: AuraCore Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Create pixi.toml for Mojo
        run: |
          mkdir -p mojo_env
          cat > mojo_env/pixi.toml << 'TOML'
          [project]
          name = "mojo_env"
          version = "0.1.0"
          channels = ["conda-forge", "https://conda.modular.com/max"]
          platforms = ["linux-64"]

          [dependencies]
          max = "*"
          TOML

      - name: Install Mojo via pixi
        run: |
          cd mojo_env
          pixi install

      - name: Build AuraCore
        run: |
          mkdir -p build
          cd mojo_env
          pixi run mojo build ../src/cli_interface.mojo -o ../build/auracore

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: auracore-linux-x64
          path: build/auracore
