name: AuraCore Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Magic via apt
        run: |
          curl -fsSL https://pkgs.modular.com/public/magic/setup.deb.sh | sudo bash
          sudo apt-get install -y magic

      - name: Install Mojo
        run: |
          magic init auracore_env --format mojoproject
          cd auracore_env
          magic add max

      - name: Build AuraCore
        run: |
          mkdir -p build
          cd auracore_env
          magic run mojo build ../src/cli_interface.mojo -o ../build/auracore

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: auracore-linux-x64
          path: build/auracore
