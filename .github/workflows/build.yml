name: AuraCore Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Create pixi project and install Mojo
        run: |
          pixi init mojo_env
          cd mojo_env
          pixi add max --channel conda-forge --channel https://conda.modular.com/max

      - name: Build AuraCore
        run: |
          mkdir -p build
          cd mojo_env
          pixi run mojo build ../src/cli_interface.mojo -o ../build/auracore

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: auracore-linux-x64
          path: build/auracore
