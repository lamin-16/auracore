name: AuraCore Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: modularml/mojo:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Mojo
        run: mojo --version

      - name: Build AuraCore
        run: |
          mkdir -p build
          mojo build src/cli_interface.mojo -o build/auracore

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: auracore-linux-x64
          path: build/auracore
