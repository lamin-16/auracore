name: AuraCore Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Magic
        run: |
          curl -fsSL https://dl.modular.com/public/magic/resolve/sh | bash
          echo "$HOME/.modular/bin" >> $GITHUB_PATH

      - name: Install Mojo
        run: |
          export PATH="$HOME/.modular/bin:$PATH"
          magic install mojo

      - name: Verify Mojo
        run: |
          export PATH="$HOME/.modular/bin:$PATH"
          mojo --version

      - name: Build AuraCore
        run: |
          export PATH="$HOME/.modular/bin:$PATH"
          mkdir -p build
          mojo build src/cli_interface.mojo -o build/auracore

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: auracore-linux-x64
          path: build/auracore
