name: AuraCore CI

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "Checking project structure..."
          test -f src/secure_vault.mojo && echo "secure_vault.mojo OK"
          test -f src/agent_core.mojo && echo "agent_core.mojo OK"
          test -f src/cli_interface.mojo && echo "cli_interface.mojo OK"
          test -f mojoproject.toml && echo "mojoproject.toml OK"
          echo "All files present. Mojo build requires local environment."

      - name: Count lines of code
        run: |
          echo "Lines of Mojo code:"
          wc -l src/*.mojo
